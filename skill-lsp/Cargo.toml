[package]
name = "skill-lsp"
version = "0.2.0"
edition = "2021"
authors = ["CatPaw <catpaw@meituan.com>"]
description = "Language Server Protocol implementation for Cadence SKILL"
license = "MIT"

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
regex = "1"
dashmap = "5"
ropey = "1.6"
