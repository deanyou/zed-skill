name = "Skill"
grammar = "skill"
path_suffixes = ["il", "ils", "skill"]
line_comments = ["; "]
tab_size = 4
hard_tabs = false
autoclose_before = " \t\r\n)],\"}"
brackets = [
    { start = "(", end = ")", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "{", end = "}", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
]
